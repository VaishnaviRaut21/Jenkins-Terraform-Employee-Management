<!DOCTYPE html>
<html>

<head>
    <title>Add Employee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Add Employee</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text"
               name="name"
               required>

        <label>Department</label>
        <input type="text"
               name="department"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               required>

        <label>Salary</label>
        <input type="number"
               name="salary"
               required>

        <button type="submit">
            Add Employee
        </button>

    </form>

    <br>

    <a href="/">
        Back to Employee List
    </a>

</div>

</body>
</html>
